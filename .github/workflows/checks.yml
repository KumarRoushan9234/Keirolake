# Pull requests get the same engine tests and interface build a release runs (on Linux and Windows).
name: Checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Engine tests
        run: |
          pip install -e "backend[dev]"
          cd backend && python -m pytest -q -m "not integration"
      - name: Interface type-check and build
        working-directory: frontend
        run: npm ci && npm run build
