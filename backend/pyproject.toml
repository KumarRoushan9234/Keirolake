[project]
name = "keirolake"
version = "0.9.0"
description = "Local data lake + RAG platform on Qdrant, SQLite and KeiroLabs web search"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "python-dotenv>=1.0",
  "sqlalchemy>=2.0",
  "pandas>=2.2",
  "openpyxl>=3.1",
  "qdrant-client>=1.12",
  "httpx>=0.27",
  "tenacity>=9.0",
  "anthropic>=0.40",
  "sse-starlette>=2.1",
  "pypdf>=5.0",
  "pdfplumber==0.11.11",
  "python-docx>=1.1",
  "trafilatura>=2.0",
  "typer>=0.12",
  "libzim>=3.6",
  "lxml>=5.0",
  "psutil>=6.0",
  "keyring>=25.0",
  "cryptography>=42",
  "fpdf2>=2.8",
  "zstandard>=0.22",
  "faster-whisper>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21"]
desktop = ["pyinstaller>=6.16"]

[project.scripts]
keirolake = "app.cli:app"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: needs a running Qdrant (docker compose up qdrant)"]
