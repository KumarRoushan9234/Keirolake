name: keirolake

# Ports bind to 127.0.0.1 only: the stack has no login, so it is not exposed on your network.
# Change a host port in .env (API_PORT, WEB_PORT, QDRANT_PORT) if it is already taken.
services:
  qdrant:
    image: qdrant/qdrant:v1.20.0
    container_name: keirolake-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"   # REST + dashboard (/dashboard)
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    container_name: keirolake-api
    restart: unless-stopped
    env_file: .env
    environment:          # these override the same names from .env, which targets running outside Docker
      QDRANT_URL: http://qdrant:6333
      DATA_DIR: /data
      OLLAMA_BASE_URL: http://ollama:11434
      CORS_ORIGINS: http://localhost:${WEB_PORT:-3000}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - ./data:/data
    depends_on:
      qdrant:
        condition: service_healthy

  web:
    build: ./frontend
    container_name: keirolake-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:80"
    depends_on:
      - api

  # Optional, fully local models:  docker compose --profile ollama up -d
  ollama:
    image: ollama/ollama:latest
    container_name: keirolake-ollama
    profiles: ["ollama"]
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama

volumes:
  qdrant_data:
  ollama_data:
